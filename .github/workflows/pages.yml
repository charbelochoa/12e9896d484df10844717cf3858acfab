name: Publicar EducatIA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/seed.py"
      - "tools/build_pages.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
